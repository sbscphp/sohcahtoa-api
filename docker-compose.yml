services:
  # PostgreSQL - Single unified database
  postgres:
    image: postgres:15-alpine
    container_name: sochatoa-postgres
    environment:
      POSTGRES_DB: sochatoa_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - sochatoa-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sochatoa_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Redis - Caching and session storage
  redis:
    image: redis:7-alpine
    container_name: sochatoa-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - sochatoa-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: redis-server --appendonly yes
    restart: unless-stopped

  # Sochatoa API Monolith
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sochatoa-api
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      # Database Configuration - using Docker service names
      DATABASE_URL: postgresql://postgres:password@postgres:5432/sochatoa_db?schema=public
      # Redis Configuration - using Docker service name
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - sochatoa-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local

networks:
  sochatoa-network:
    driver: bridge
