services:
  # PostgreSQL - Single unified database
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: sochatoa_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - sochatoa-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sochatoa_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis - Caching and session storage
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - sochatoa-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: redis-server --appendonly yes

  # Sochatoa API Monolith
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      # Server Configuration
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
      SERVICE_NAME: sochatoa-api-monolith

      # Database Configuration
      DATABASE_URL: postgresql://postgres:password@postgres:5432/sochatoa_db?schema=public

      # Redis Configuration
      REDIS_URL: redis://redis:6379

      # JWT Secrets (CHANGE IN PRODUCTION!)
      JWT_ACCESS_SECRET: your-super-secret-access-key-change-in-production
      JWT_REFRESH_SECRET: your-super-secret-refresh-key-change-in-production
      JWT_ACCESS_EXPIRY: 15m
      JWT_REFRESH_EXPIRY: 7d

      # SMTP Configuration (Optional - configure for email sending)
      # SMTP_HOST: smtp.gmail.com
      # SMTP_PORT: 587
      # SMTP_SECURE: false
      # SMTP_USER: your-email@gmail.com
      # SMTP_PASSWORD: your-app-password
      # SMTP_FROM: noreply@sochatoa.com

      # API Configuration
      CORS_ORIGIN: "*"
      API_BASE_URL: http://localhost:3000
      API_BASE_PATH: ""

      # SMS Configuration (Optional - Termii)
      # TERMII_API_KEY: your-termii-api-key
      # TERMII_SENDER_ID: Sochatoa

      # Cloudinary Configuration (Optional - for document uploads)
      # CLOUDINARY_CLOUD_NAME: your-cloud-name
      # CLOUDINARY_API_KEY: your-api-key
      # CLOUDINARY_API_SECRET: your-api-secret

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - sochatoa-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local

networks:
  sochatoa-network:
    driver: bridge
