services:
  # Redis - Caching and session storage
  redis:
    image: redis:7-alpine
    container_name: sochatoa-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - sochatoa-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: redis-server --appendonly yes
    restart: unless-stopped

  # Sochatoa API
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sochatoa-api
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      # REDIS_URL points to the local redis container.
      # DATABASE_URL comes from .env — do NOT override it here.
      REDIS_URL: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - sochatoa-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  redis-data:
    driver: local

networks:
  sochatoa-network:
    driver: bridge
