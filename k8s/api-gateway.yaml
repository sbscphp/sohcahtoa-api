apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: fx-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
      - name: api-gateway
        image: fx-platform/api-gateway:latest
        ports:
        - containerPort: 3000
        env:
        - name: PORT
          value: "3000"
        - name: AUTH_SERVICE_URL
          value: http://auth-service:3001
        - name: TRANSACTION_SERVICE_URL
          value: http://transaction-service:3003
        - name: PAYMENT_SERVICE_URL
          value: http://payment-service:3004
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: fx-platform
spec:
  type: LoadBalancer
  selector:
    app: api-gateway
  ports:
  - port: 80
    targetPort: 3000
