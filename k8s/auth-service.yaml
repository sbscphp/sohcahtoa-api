apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: fx-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
      - name: auth-service
        image: fx-platform/auth-service:latest
        ports:
        - containerPort: 3001
        env:
        - name: PORT
          value: "3001"
        - name: DATABASE_URL
          value: postgresql://postgres:password@postgres-auth:5432/auth_db?schema=public
        - name: REDIS_HOST
          value: redis
        - name: KAFKA_BROKERS
          value: kafka:9092
        - name: JWT_ACCESS_SECRET
          valueFrom:
            secretKeyRef:
              name: jwt-secret
              key: access-secret
        livenessProbe:
          httpGet:
            path: /api/auth/health
            port: 3001
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /api/auth/health
            port: 3001
          initialDelaySeconds: 10
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: fx-platform
spec:
  selector:
    app: auth-service
  ports:
  - port: 3001
    targetPort: 3001
